name: Build Anzo Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 📱 Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔧 Patch Kotlin 1.9.25 for Compose Compiler
        run: |
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties
          echo "android.suppressKotlinVersionCompatibilityCheck=1.9.24,1.9.25" >> android/gradle.properties
          echo "kotlin.suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties
          sed -i 's/kotlinVersion = findProperty.*$/kotlinVersion = "1.9.25"/' android/build.gradle

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload Anzo APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anzo-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
